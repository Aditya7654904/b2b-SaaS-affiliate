    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #000000; color: #ffffff; }
    h1, h2, h3, h4, .brand-font { font-family: 'Space Grotesk', sans-serif; }

    .stark-button:hover { background-color: #e5e5e5; transform: translate(-1px, -1px); box-shadow: 5px 5px 0px #ffffff; }
    .prose-stark h1, .prose-stark h2, .prose-stark h3 { color: #ffffff; font-family: 'Space Grotesk', sans-serif; margin-top: 1.5rem; margin-bottom: 0.75rem; font-weight: 700; text-transform: uppercase; }
    .prose-stark h1 { font-size: 1.875rem; border-bottom: 2px solid #333; padding-bottom: 0.5rem; }
    .prose-stark p { color: #d4d4d8; margin-bottom: 1rem; line-height: 1.7; }
    .prose-stark strong { color: #ffffff; font-weight: 700; }
  </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-white selection:text-black">
  <!-- Google Tag Manager (noscript) -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-T8X7V8P3" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>

  <header class="border-b-2 border-white bg-black sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
      <a href="index.html" class="text-3xl font-bold tracking-tight brand-font bg-white text-black px-3 py-1">MOIRA</a>
      <a href="index.html" class="stark-button px-5 py-2.5 text-sm uppercase tracking-wider">← Back to Home</a>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-6 py-16 flex-1 w-full space-y-8">
    <div class="border-2 border-white p-8 bg-zinc-950 space-y-4">
      <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-zinc-800 pb-4">
        <div>
          <span id="postCategory" class="text-xs font-mono text-zinc-400 uppercase tracking-widest">ARTICLE</span>
          <h1 id="postTitle" class="text-3xl font-bold uppercase mt-1 brand-font">Loading Article...</h1>
        </div>
        <div class="text-right">
          <span id="postRating" class="bg-white text-black font-mono font-bold text-lg px-3 py-1 inline-block">★ --</span>
          <div id="postPrice" class="text-xs font-mono text-zinc-400 mt-1">--</div>
        </div>
      </div>
    </div>

    <!-- Rendered Markdown Body -->
    <div id="postBody" class="prose-stark"></div>

    <div class="border-2 border-white p-6 bg-white text-black space-y-3 mt-12">
      <h3 class="text-xl font-bold uppercase brand-font">Looking to optimize your software stack?</h3>
      <p class="text-sm font-medium">Get custom software recommendations and partner deals for your business.</p>
      <a href="stack.html" class="inline-block bg-black text-white px-6 py-3 font-bold text-xs uppercase tracking-wider hover:bg-zinc-800">
        Browse All Software Stacks →
      </a>
    </div>
  </main>

  <footer class="py-10 px-6 border-t-2 border-white bg-black text-xs font-mono text-zinc-400">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <div>© 2026 Moira Media. All rights reserved.</div>
      <a href="index.html" class="hover:text-white">Home</a>
    </div>
  </footer>

  <script>
    async function initPostViewer() {
      const urlParams = new URLSearchParams(window.location.search);
      const slug = urlParams.get('slug') || urlParams.get('file') || 'hubspot';

      let posts = [];
      const saved = localStorage.getItem('moira_cms_posts');
      if (saved) {
        try { posts = JSON.parse(saved); } catch(e) {}
      }

      if (!posts.length) {
        try {
          const res = await fetch('posts.json?v=' + Date.now());
          posts = await res.json();
        } catch(e) {}
      }

      const post = posts.find(p => (p.slug === slug) || (p.id === slug) || (p.file === slug));

      if (post) {
        document.getElementById('postTitle').innerText = post.title;
        document.getElementById('postCategory').innerText = (post.category || 'ARTICLE').toUpperCase();
        document.getElementById('postRating').innerText = post.rating || '★ 4.8';
        document.getElementById('postPrice').innerText = post.price || '';
        document.getElementById('postBody').innerHTML = marked.parse(post.markdown || post.description || 'No content found.');
        document.title = post.title + " - Moira";
      } else {
        document.getElementById('postTitle').innerText = "Article Not Found";
        document.getElementById('postBody').innerHTML = "<p>The requested article could not be located in the vault.</p>";
      }
    }

    document.addEventListener('DOMContentLoaded', initPostViewer);
  </script>
</body>
</html>
